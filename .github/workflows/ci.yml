name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ main, orchestrator ]

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run pre-commit
        run: pre-commit run --all-files

      - name: Static type check
        run: mypy src/csorchestrator

      - name: Run tests with coverage
        run: |
          set -o pipefail
          pytest --cov=csorchestrator --cov-branch --cov-report=xml --cov-report=html --cov-report=term-missing | tee coverage.txt

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          slug: cscosine/csOrchestrator

      - name: Upload coverage HTML as artifact
        uses: actions/upload-artifact@v6
        with:
          name: coverage-html
          path: htmlcov          

      - name: Add coverage to summary
        run: |
          echo "## 🧪 Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat coverage.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY