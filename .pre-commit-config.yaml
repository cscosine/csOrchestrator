repos:

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        args:
          [
            "--config-file=pyproject.toml",
          ]
        exclude: ^tests/

  - repo: local
    hooks:
      - id: no-unstaged-changes
        name: Fail if unstaged changes exist
        entry: git diff --quiet
        language: system
        pass_filenames: false